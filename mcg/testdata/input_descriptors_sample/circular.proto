syntax = "proto3";

import "mcg/testdata/input_descriptors_sample/unused.proto";

package input_descriptors.circular;

message MessageA {
    string name = 1;
    MessageB circular_ref = 2;
}

message MessageB {
    int32 id = 1;
    MessageA circular_ref = 2;
}

// Unused circular message to utilize the unused.proto import, preventing unused import warnings.
message UnusedCircularMessage {
    input_descriptors.unused.UnusedPlaceholderMessage unused_field = 1;
}

