syntax = "proto3";

package vehicle_signals.message;

enum basic_enum {
    ONE = 0;
    TWO = 1;
    THREE = 2;
}

message Message {
    double double_field = 1;
    basic_enum enum_field = 2;

    // Message definition nested inside another message definition.
    message NestedMessage {
        // Message definition nested inside another nested message definition.
        message InnerNestedMessage {
            int32 nested_int_field = 1;
        }
        InnerNestedMessage inner_message = 1;
    }
    NestedMessage nested_message = 3;
}
