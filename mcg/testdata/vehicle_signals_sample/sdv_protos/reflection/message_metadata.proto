syntax = "proto3";

package google.sdv.vsidl;

import "google/protobuf/descriptor.proto";

message MessageMetadata {
  // Required.
  // Array of Protobuf file descriptors that contain the `message_full_name` and all its
  // nested sub-messages.
  repeated google.protobuf.FileDescriptorProto file_descriptors = 1;

  // Required.
  // The full name of the message to be accessed via reflection.
  // Fully qualified names should start with '.'.
  string message_full_name = 2;
}
