        "400":
          description: "INVALID_ARGUMENT: Invalid Metrics config."
          content:
            application/x-protobuf;proto=google.protobuf.FileDescriptorSet:
              schema:
                $ref: "#/components/schemas/errors.JsonErrorResponse"
            text/x-protobuf;proto=google.protobuf.FileDescriptorSet;charset=utf-8:
              schema:
                $ref: "#/components/schemas/errors.JsonErrorResponse"
  /api/v2/validate_metrics_config:
