openapi: 3.0.1
info:
  title: Metrics Config Generator
  description: Generate MetricsConfig for the SDV Telemetry Service
  contact:
    name: Android SDV Telemetry
    email: aaos-sdv-telemetry-external@google.com
  version: "<<<REPLACED DURING BUILD>>>"
servers:
- url: '{url}'
  variables:
    url:
      default: "/"
      description: The base URL of MCG (use `/` for the current URL).
paths:
  /api/v1/generate_metrics_config:
    post:
      description: Create a metrics config from one large request
      parameters:
      - name: ignore_validation
        in: query
        description: Ignore any validation errors and return the metrics config anyways
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      requestBody:
        description: Metrics config request
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/requests.MetricsConfigRequestV1"
        required: true
      responses:
        "200":
          description: Metrics configuration
          headers:
            Metrics-Config-Size:
              description: Size of the MetricsConfiguration in binary format in Bytes
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/x-protobuf;proto=google.sdv.telemetry.MetricsConfig:
              schema:
                type: object
            text/x-protobuf;proto=google.sdv.telemetry.MetricsConfig;charset=utf-8:
              schema:
                type: object
                description: Legacy textproto format
        "400":
          description: "INVALID_ARGUMENT: Various data validation errors"
          content:
            application/x-protobuf;proto=google.sdv.telemetry.MetricsConfig:
              schema:
                $ref: "#/components/schemas/errors.JsonErrorResponse"
            text/x-protobuf;proto=google.sdv.telemetry.MetricsConfig;charset=utf-8:
              schema:
                $ref: "#/components/schemas/errors.JsonErrorResponse"
        "500":
          description: "INTERNAL: Internal errors"
          content:
            application/x-protobuf;proto=google.sdv.telemetry.MetricsConfig:
              schema:
                $ref: "#/components/schemas/errors.JsonErrorResponse"
            text/x-protobuf;proto=google.sdv.telemetry.MetricsConfig;charset=utf-8:
              schema:
                $ref: "#/components/schemas/errors.JsonErrorResponse"
      x-codegen-request-body-name: body
  /api/v1/get_file_descriptor_set:
    post:
      description: Returns FileDescriptors for a given MetricsConfiguration
      requestBody:
        description: Metrics config textproto
        content:
          application/x-protobuf;proto=google.sdv.telemetry.MetricsConfig:
            schema:
              type: string
          text/x-protobuf;proto=google.sdv.telemetry.MetricsConfig;charset=utf-8:
            schema:
              type: string
              description: Legacy textproto format
        required: false
      responses:
        "200":
          description: FileDescriptorSet
          content:
            application/x-protobuf;proto=google.protobuf.FileDescriptorSet:
              schema:
                type: object
            text/x-protobuf;proto=google.protobuf.FileDescriptorSet;charset=utf-8:
              schema:
                type: object
        "400":
          description: "INVALID_ARGUMENT: Invalid Metrics config."
          content:
            application/x-protobuf;proto=google.protobuf.FileDescriptorSet:
              schema:
                $ref: "#/components/schemas/errors.JsonErrorResponse"
            text/x-protobuf;proto=google.protobuf.FileDescriptorSet;charset=utf-8:
              schema:
                $ref: "#/components/schemas/errors.JsonErrorResponse"
  /api/v1/validate_metrics_config:
    post:
      description: Validate the passed metrics config. Returns a list of validation
        errors in case any.
      parameters:
      - name: return_config
        in: query
        description: Return MetricsConfig on successful validation
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      requestBody:
        description: Metrics config textproto
        content:
          application/x-protobuf;proto=google.sdv.telemetry.MetricsConfig:
            schema:
              type: string
          text/x-protobuf;proto=google.sdv.telemetry.MetricsConfig;charset=utf-8:
            schema:
              type: string
              description: Legacy textproto format
        required: false
      responses:
        "200":
          description: Empty object (default) or Metrics Configuration (for return_config=true)
          headers:
            Metrics-Config-Size:
              description: Size of the MetricsConfiguration in binary format in Bytes
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "INVALID_ARGUMENT: Metrics config validation failed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.JsonErrorResponse"
      x-codegen-request-body-name: body
  /api/v1/version:
    get:
      tags:
      - v1 — Metadata
      description: Query MCG version information
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/mcg.VersionInfo"
  /api/v1/vs/:
    get:
      tags:
      - v1 — Vehicle Signal Catalog metadata
      description: List all Vehicle Signal Catalog metadata
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/signal_versions.VSCatalogVersionsMetadata"
        "400":
          description: Cache configuration errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.JsonErrorResponse"
    post:
      tags:
      - v1 — Vehicle Signal Catalogs
      description: Create new or update existing Vehicle Signal Catalog
      requestBody:
        description: VSCatalogVersion
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/signal_versions.VSCatalogVersion"
        required: false
      responses:
        "200":
          description: Vehicle Signal Catalog added/updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/signal_versions.VSCatalogVersionMetadata"
        "400":
          description: Cache configuration or Invalid Request errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.JsonErrorResponse"
      x-codegen-request-body-name: body
  /api/v1/vs/{version}:
    delete:
      tags:
      - v1 — Vehicle Signal Catalogs
      description: Delete Vehicle Signal Catalog
      parameters:
      - name: version
        in: path
        description: Vendor-defined identifier of the Vehicle Signal Catalog to delete
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: Vehicle Signal Catalog deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/signal_versions.VSCatalogVersionMetadata"
        "400":
          description: Cache configuration or Invalid Request errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.JsonErrorResponse"
        "404":
          description: Vehicle Signal Catalog not found
          content:
            application/json:
              schema:
                type: object
