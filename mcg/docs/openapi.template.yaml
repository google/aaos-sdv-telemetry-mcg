            text/x-protobuf;proto=google.sdv.telemetry.MetricsConfig;charset=utf-8:
              schema:
                type: object
        "400":
          description: "INVALID_ARGUMENT: Various data validation errors"
          content:
            application/x-protobuf;proto=google.sdv.telemetry.MetricsConfig:
              schema:
                $ref: "#/components/schemas/errors.JsonErrorResponse"
            text/x-protobuf;proto=google.sdv.telemetry.MetricsConfig;charset=utf-8:
              schema:
                $ref: "#/components/schemas/errors.JsonErrorResponse"
        "500":
          description: "INTERNAL: Internal errors"
          content:
            application/x-protobuf;proto=google.sdv.telemetry.MetricsConfig:
              schema:
                $ref: "#/components/schemas/errors.JsonErrorResponse"
            text/x-protobuf;proto=google.sdv.telemetry.MetricsConfig;charset=utf-8:
              schema:
                $ref: "#/components/schemas/errors.JsonErrorResponse"
      x-codegen-request-body-name: body
  /api/v2/get_file_descriptor_set:
